server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular client-side routes should fall back to the app entry point.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Avoid serving a stale app shell after deployments.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
